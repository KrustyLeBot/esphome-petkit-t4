# Zigbidouille additions to the Petkit T4 firmware, kept in their own package so the main
# petkit.yaml stays close to upstream (Triskae/egormanga) and their fixes merge cleanly.
#
# - A web API for Homey (app/drivers/petkit-t4 in KrustyLeBot/ZigbidouilleHomeyApp): REST + an
#   event stream (/events), behind a login. Also the device's own status/control page.
# - Two pets told apart by weight ranges, with the last visit and per-pet counters.
# - A minimum interval between two automatic cleanings.
# - The PETKIT K3 smart spray (deodorizer), over Bluetooth, as the stock firmware drives it.
# - A child lock for the two buttons.
#
# Everything here runs on the litter box itself: Homey only reads it and changes settings, so the
# box keeps cleaning, identifying the pets and deodorizing while Homey is down.
#
# Entity NAMES are the API: the web server addresses entities by name
# (POST /switch/Auto Clean/turn_on). Renaming one breaks the Homey driver — change both together.

web_server:
  port: 80
  version: 3
  local: true  # serve the page's JS from the device: it must work with the internet blocked
  ota: false   # firmware updates go through the password-protected native OTA only
  auth:
    username: !secret web_username
    password: !secret web_password
    type: basic

globals:
  - id: visit_samples  # pet weight samples of the visit in progress
    type: std::vector<float>

  - id: visits_day  # local day-of-year the per-pet counters belong to
    type: int
    restore_value: yes

  - id: pet1_visits
    type: int
    restore_value: yes

  - id: pet2_visits
    type: int
    restore_value: yes

  - id: unknown_visits
    type: int
    restore_value: yes

  - id: visit_total
    type: int
    restore_value: yes

  - id: k3_secret  # hex, from secrets.yaml (k3_secret)
    type: std::string
    initial_value: '"${k3_secret}"'

  - id: k3_sprayed  # the spray command was written in this session
    type: bool

  - id: deodorize_total
    type: int
    restore_value: yes

  - id: deodorize_minute  # last local minute a periodic deodorizing ran (no double run)
    type: int

number:
  # Defaults: Zeus ~4.3 kg, Ares ~5.0 kg, split halfway. Tune from Homey once real weights show up.
  - platform: template
    id: pet1_min
    name: Pet 1 Min Weight
    icon: mdi:weight-kilogram
    entity_category: config
    unit_of_measurement: kg
    mode: box
    min_value: 0.5
    max_value: 15
    step: 0.05
    optimistic: yes
    restore_value: yes
    initial_value: 3.5

  - platform: template
    id: pet1_max
    name: Pet 1 Max Weight
    icon: mdi:weight-kilogram
    entity_category: config
    unit_of_measurement: kg
    mode: box
    min_value: 0.5
    max_value: 15
    step: 0.05
    optimistic: yes
    restore_value: yes
    initial_value: 4.65

  - platform: template
    id: pet2_min
    name: Pet 2 Min Weight
    icon: mdi:weight-kilogram
    entity_category: config
    unit_of_measurement: kg
    mode: box
    min_value: 0.5
    max_value: 15
    step: 0.05
    optimistic: yes
    restore_value: yes
    initial_value: 4.65

  - platform: template
    id: pet2_max
    name: Pet 2 Max Weight
    icon: mdi:weight-kilogram
    entity_category: config
    unit_of_measurement: kg
    mode: box
    min_value: 0.5
    max_value: 15
    step: 0.05
    optimistic: yes
    restore_value: yes
    initial_value: 6.0

  - platform: template
    id: min_clean_interval
    name: Min Clean Interval
    icon: mdi:timer-sand
    entity_category: config
    unit_of_measurement: min
    mode: box
    min_value: 0
    max_value: 240
    step: 1
    optimistic: yes
    restore_value: yes
    initial_value: 5  # stock "avoid repeated cleanings": 5 min

text:
  - platform: template
    id: pet1_name
    name: Pet 1 Name
    icon: mdi:cat
    entity_category: config
    mode: text
    max_length: 16
    optimistic: yes
    restore_value: yes
    initial_value: Zeus

  - platform: template
    id: pet2_name
    name: Pet 2 Name
    icon: mdi:cat
    entity_category: config
    mode: text
    max_length: 16
    optimistic: yes
    restore_value: yes
    initial_value: Ares

  - platform: template
    id: deodorize_times
    name: Deodorize Times
    icon: mdi:clock-outline
    entity_category: config
    mode: text
    max_length: 35  # six "HH:MM" separated by commas, as the stock app allows
    optimistic: yes
    restore_value: yes
    initial_value: '07:00,10:00,13:00,16:00,19:00,21:00'  # stock periodic deodorizing




esp32_ble_tracker:
  scan_parameters:
    active: false  # the K3 is found from its advertisements; no need to query every device around

ble_client:
  # The PETKIT K3 smart spray. Protocol from sergey-akhmineev/PetKit-Smart-Spray: write on
  # 0000aaa2 an init frame, then an auth frame carrying the K3's secret, then the spray command.
  # The K3 runs on batteries: connect only to spray, then disconnect (the stock box does the same).
  - id: k3
    mac_address: ${k3_mac}
    auto_connect: false

switch:
  - platform: template
    id: auto_deodorize
    name: Auto Deodorize
    icon: mdi:spray
    entity_category: config
    optimistic: yes
    restore_mode: restore_default_on

  - platform: template
    id: intense_deodorize
    name: Intense Deodorize
    icon: mdi:spray
    entity_category: config
    optimistic: yes
    restore_mode: restore_default_on

  - platform: template
    id: child_lock
    name: Child Lock
    icon: mdi:lock
    entity_category: config
    optimistic: yes
    restore_mode: restore_default_off

button:
  - platform: template
    name: Deodorize
    icon: mdi:spray
    on_press:
      script.execute: deodorize

sensor:
  # One visit = one Pet Inside press/release. Published in this order by record_visit:
  # the details first, Visit Count last, so a client reacting to Visit Count reads a
  # consistent visit.
  - platform: template
    id: last_visit_weight
    name: Last Visit Weight
    icon: mdi:scale-bathroom
    unit_of_measurement: kg
    accuracy_decimals: 2
    device_class: weight
    update_interval: never

  - platform: template
    id: last_visit_duration
    name: Last Visit Duration
    icon: mdi:timer-outline
    unit_of_measurement: s
    accuracy_decimals: 0
    device_class: duration
    update_interval: never

  - platform: template
    id: pet1_last_weight
    name: Pet 1 Last Weight
    icon: mdi:scale-bathroom
    unit_of_measurement: kg
    accuracy_decimals: 2
    device_class: weight
    update_interval: never

  - platform: template
    id: pet2_last_weight
    name: Pet 2 Last Weight
    icon: mdi:scale-bathroom
    unit_of_measurement: kg
    accuracy_decimals: 2
    device_class: weight
    update_interval: never

  - platform: template
    id: pet1_visits_today
    name: Pet 1 Visits Today
    icon: mdi:counter
    accuracy_decimals: 0
    update_interval: 60s
    lambda: return id(pet1_visits);

  - platform: template
    id: pet2_visits_today
    name: Pet 2 Visits Today
    icon: mdi:counter
    accuracy_decimals: 0
    update_interval: 60s
    lambda: return id(pet2_visits);

  - platform: template
    id: unknown_visits_today
    name: Unknown Visits Today
    icon: mdi:counter
    accuracy_decimals: 0
    update_interval: 60s
    lambda: return id(unknown_visits);

  - platform: template
    id: visit_count
    name: Visit Count
    icon: mdi:counter
    accuracy_decimals: 0
    state_class: total_increasing
    update_interval: 60s
    lambda: return id(visit_total);

  - platform: template
    id: deodorize_count
    name: Deodorize Count
    icon: mdi:spray
    accuracy_decimals: 0
    state_class: total_increasing
    update_interval: 60s
    lambda: return id(deodorize_total);

text_sensor:
  - platform: template
    id: last_visit_pet
    name: Last Visit Pet
    icon: mdi:cat
    update_interval: never

  - platform: template
    id: last_deodorize
    name: Last Deodorize
    icon: mdi:spray
    update_interval: never

script:
  - id: record_visit  # called by Pet Inside's on_release (petkit.yaml)
    then:
      - lambda: |-
          auto &samples = id(visit_samples);
          // Pet Inside releases 5 s after the weight drops (delayed_off).
          const uint32_t seconds = (millis() - id(visit_started_at)) / 1000;
          const uint32_t duration = seconds > 5 ? seconds - 5 : 0;
          if (samples.size() < 3) {  // a paw on the edge, not a visit
            samples.clear();
            return;
          }
          const float weight = zigbidouille::median(samples);
          samples.clear();
          const int pet = zigbidouille::classify(weight, id(pet1_min).state, id(pet1_max).state,
                                                 id(pet2_min).state, id(pet2_max).state);
          id(last_visit_weight).publish_state(weight);
          id(last_visit_duration).publish_state(duration);
          if (pet == 1) {
            id(pet1_visits)++;
            id(pet1_last_weight).publish_state(weight);
            id(last_visit_pet).publish_state(id(pet1_name).state);
          } else if (pet == 2) {
            id(pet2_visits)++;
            id(pet2_last_weight).publish_state(weight);
            id(last_visit_pet).publish_state(id(pet2_name).state);
          } else {
            id(unknown_visits)++;
            id(last_visit_pet).publish_state("Unknown");
          }
          ESP_LOGI("zigbidouille", "visit: pet %d, %.2f kg, %u s", pet, weight, (unsigned) duration);
          id(visit_total)++;
          id(pet1_visits_today).publish_state(id(pet1_visits));
          id(pet2_visits_today).publish_state(id(pet2_visits));
          id(unknown_visits_today).publish_state(id(unknown_visits));
          id(visit_count).publish_state(id(visit_total));  // last: the signal that a visit was recorded
          if (id(auto_deodorize).state) id(deodorize_after_visit).execute();

  - id: deodorize_after_visit  # stock: deodorize after each use, once the pet is gone
    mode: restart
    then:
      - delay: 30s
      - wait_until:
          condition:
            all:
              - binary_sensor.is_off: approach
              - binary_sensor.is_off: pet_inside
          timeout: 10min
      - if:
          all:
            - binary_sensor.is_off: approach
            - binary_sensor.is_off: pet_inside
          then:
            script.execute: deodorize

  - id: k3_session  # connect, authenticate, spray (twice if intense), disconnect
    mode: single
    then:
      - ble_client.connect: k3  # waits for the connection; the chain stops if it drops
      - ble_client.ble_write:
          id: k3
          service_uuid: 0000aaa0-0000-1000-8000-00805f9b34fb
          characteristic_uuid: 0000aaa2-0000-1000-8000-00805f9b34fb
          value: [0xfa, 0xfc, 0xfd, 0xd5, 0x01, 0x00, 0x00, 0x00, 0xfb]  # init
      - delay: 500ms
      - ble_client.ble_write:
          id: k3
          service_uuid: 0000aaa0-0000-1000-8000-00805f9b34fb
          characteristic_uuid: 0000aaa2-0000-1000-8000-00805f9b34fb
          value: !lambda return zigbidouille::from_hex("fafcfd56010108000000" + id(k3_secret) + "fb");  # auth
      - delay: 500ms
      - ble_client.ble_write:
          id: k3
          service_uuid: 0000aaa0-0000-1000-8000-00805f9b34fb
          characteristic_uuid: 0000aaa2-0000-1000-8000-00805f9b34fb
          value: [0xfa, 0xfc, 0xfd, 0xdc, 0x01, 0x0a, 0x02, 0x00, 0x01, 0x03, 0xfb]  # spray (~10 s)
      - globals.set:
          id: k3_sprayed
          value: 'true'
      - if:  # stock "intense": two sprays in a row; never with a pet around
          all:
            - switch.is_on: intense_deodorize
          then:
            - delay: 12s
            - if:
                all:
                  - binary_sensor.is_off: approach
                  - binary_sensor.is_off: pet_inside
                then:
                  ble_client.ble_write:
                    id: k3
                    service_uuid: 0000aaa0-0000-1000-8000-00805f9b34fb
                    characteristic_uuid: 0000aaa2-0000-1000-8000-00805f9b34fb
                    value: [0xfa, 0xfc, 0xfd, 0xdc, 0x01, 0x0a, 0x02, 0x00, 0x01, 0x03, 0xfb]
      - delay: 1s
      - ble_client.disconnect: k3

  - id: deodorize  # stock: never while a pet is there
    mode: single
    then:
      - if:
          any:
            - binary_sensor.is_on: approach
            - binary_sensor.is_on: pet_inside
            - lambda: return id(k3_secret).empty();
          then:
            - lambda: |-
                const char *why = id(k3_secret).empty() ? "skipped: no K3 configured" : "skipped: a pet is there";
                ESP_LOGI("zigbidouille", "deodorize %s", why);
                id(last_deodorize).publish_state(why);
            - script.stop: deodorize
      - globals.set:
          id: k3_sprayed
          value: 'false'
      - script.execute: k3_session
      - wait_until:  # the K3 may be out of range or asleep: give up rather than hang
          condition:
            not:
              script.is_running: k3_session
          timeout: 45s
      - if:
          condition:
            script.is_running: k3_session
          then:
            - script.stop: k3_session
            - ble_client.disconnect: k3
      - lambda: |-
          const bool ok = id(k3_sprayed);
          ESP_LOGI("zigbidouille", "deodorize %s", ok ? "OK" : "failed: K3 unreachable");
          id(last_deodorize).publish_state(ok ? "OK" : "failed: K3 unreachable");
          id(deodorize_total)++;
          id(deodorize_count).publish_state(id(deodorize_total));  // last: the signal for Homey

interval:
  - interval: 1s  # weight samples while a pet is inside, for record_visit's median
    then:
      - lambda: |-
          if (id(pet_inside).state && id(pet_weight).state >= id(pet_threshold).state && id(visit_samples).size() < 600)
            id(visit_samples).push_back(id(pet_weight).state);

  - interval: 20s  # periodic deodorizing, at the "Deodorize Times" (local time)
    then:
      - lambda: |-
          auto now = id(ha_time).now();
          if (!now.is_valid()) return;
          const int minute = now.day_of_year * 1440 + now.hour * 60 + now.minute;
          if (minute == id(deodorize_minute)) return;
          if (zigbidouille::time_in_list(now, id(deodorize_times).state)) {
            id(deodorize_minute) = minute;
            id(deodorize).execute();
          }

  - interval: 60s  # per-pet counters are "today", in local time
    then:
      - lambda: |-
          auto now = id(ha_time).now();
          if (!now.is_valid()) return;
          if (now.day_of_year != id(visits_day)) {
            id(visits_day) = now.day_of_year;
            id(pet1_visits) = 0;
            id(pet2_visits) = 0;
            id(unknown_visits) = 0;
          }
